<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build It Faster. Ideas into working things. More coming soon.">
  <meta name="theme-color" content="#111413">
  <title>Build It Faster</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111413; color: #f1f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header, main, footer { width: min(100% - 3rem, 72rem); margin-inline: auto; }
    header { padding-block: 2rem; font-size: 1rem; font-weight: 700; letter-spacing: .08em; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 5rem; }
    .label { color: #b6f36b; font-size: 1rem; font-weight: 600; }
    h1 { font-size: clamp(3.5rem, 12vw, 9rem); line-height: .98; letter-spacing: -.065em; margin: 1.2rem 0 2rem; max-width: 10ch; }
    p { color: #bbc4bb; font-size: clamp(1.1rem, 3vw, 1.4rem); line-height: 1.6; max-width: 32rem; }
    a { color: #f1f5ef; text-underline-offset: .3em; }
    a:hover { color: #b6f36b; }
    a:focus-visible { outline: 2px solid #b6f36b; outline-offset: 6px; }
    .link { margin-top: 1.5rem; align-self: flex-start; font-weight: 600; }
    footer { padding-block: 1.5rem; border-top: 1px solid #303830; color: #bbc4bb; font-size: .9rem; }
  </style>
</head>
<body>
  <header>BUILD IT FASTER</header>
  <main>
    <span class="label">Ideas into working things.</span>
    <h1>Build it.<br>Faster.</h1>
    <p>We're getting started. A home for our projects, experiments, and things we're building. More coming soon.</p>
    <a class="link" href="https://github.com/Build-It-Faster">Explore our GitHub</a>
  </main>
  <footer>Build It Faster · bif.dev</footer>
</body>
</html>
